name: Validate seminar materials
on:
  push:
    branches: [main, course-redesign-2026]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install course and verification dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Check navigation and paired teaching materials
        run: python scripts/check_materials.py
      - name: Check mathematics and numerical boundary cases
        run: python -m pytest -q
      - name: Execute every core notebook in a fresh kernel
        run: python scripts/check_notebooks.py
        env:
          MPLBACKEND: Agg
